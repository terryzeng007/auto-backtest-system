<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Backtest</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang SC",sans-serif;background:#fff;color:#1d1d1f}
.simhei{font-family:SimHei,"Heiti SC",sans-serif}
.layout{display:flex;max-width:1400px;margin:0 auto;min-height:100vh}
.main{flex:1;padding:32px 40px;min-width:0}
.sidebar{width:320px;flex-shrink:0;border-left:1px solid #e5e5ea;padding:32px 24px;position:sticky;top:0;height:100vh;overflow-y:auto}

.input-wrap{display:flex;align-items:center;border:1px solid #d2d2d7;border-radius:16px;padding:4px 4px 4px 20px;margin-bottom:32px;transition:border-color .2s}
.input-wrap:focus-within{border-color:#0071e3}
.input-wrap input{flex:1;border:none;outline:none;font-size:15px;padding:12px 0;background:transparent;color:#1d1d1f}
.input-wrap input::placeholder{color:#86868b}
.send-btn{width:40px;height:40px;border-radius:12px;border:none;background:#0071e3;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.send-btn:hover{background:#0077ed}
.send-btn:disabled{background:#d2d2d7;cursor:not-allowed}
.send-btn svg{width:18px;height:18px}

.section{margin-bottom:24px}
.section-title{font-size:16px;font-weight:600;margin-bottom:16px}
.chart-box{width:100%;height:420px}
.toggle-row{display:flex;gap:8px;margin-bottom:12px}
.t-btn{padding:6px 16px;border-radius:8px;border:1px solid #d2d2d7;background:#fff;font-size:13px;cursor:pointer;transition:all .2s;color:#86868b}
.t-btn.active{background:#0071e3;color:#fff;border-color:#0071e3}

.stats-row{display:flex;gap:24px;margin-bottom:32px}
.stat-card{flex:1;background:#f5f5f7;border-radius:16px;padding:20px 24px;text-align:center}
.stat-value{font-family:SimHei,"Heiti SC",sans-serif;font-size:20px;font-weight:700}
.stat-label{font-size:11px;color:#86868b;margin-top:4px}
.up{color:#ff3b30}
.down{color:#34c759}

.radar-box{width:100%;height:360px}

.holdings-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.holdings-hdr select{border:1px solid #d2d2d7;border-radius:8px;padding:6px 12px;font-size:13px;outline:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:#86868b;padding:10px 8px;border-bottom:1px solid #e5e5ea}
td{font-family:SimHei,"Heiti SC",sans-serif;font-size:13px;padding:10px 8px;border-bottom:1px solid #e5e5ea}
tr:hover td{background:#f5f5f7}
.num{text-align:right;font-family:"SF Mono",Menlo,monospace}

.sidebar-title{font-size:16px;font-weight:600;margin-bottom:16px}
.hot-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #e5e5ea;cursor:pointer;transition:background .15s}
.hot-item:hover{background:#f5f5f7;margin:0 -24px;padding-left:24px;padding-right:24px}
.hot-rank{font-weight:700;font-size:14px;min-width:20px}
.hot-rank.top{color:#ff3b30}
.hot-text{font-size:14px;line-height:1.4;color:#1d1d1f;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.loading-wrap{text-align:center;padding:60px 0}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #e5e5ea;border-top-color:#0071e3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;color:#86868b;font-size:14px}
.error-msg{background:#fff5f5;color:#ff3b30;padding:16px 20px;border-radius:12px;margin-bottom:24px;font-size:14px}
.empty-state{text-align:center;padding:80px 0;color:#86868b}
.empty-icon{font-size:48px;margin-bottom:16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease-out}
</style>
</head>
<body>
<div class="layout">
  <div class="main">
    <h1 style="font-size:28px;font-weight:600;margin-bottom:24px">Auto Backtest</h1>
    <div class="input-wrap">
      <input id="question" type="text" placeholder="输入你的问题，比如：PE>10的股票组合表现如何？">
      <button class="send-btn" id="sendBtn" onclick="doBacktest()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div id="emptyState" class="empty-state"><div class="empty-icon">📊</div><div>输入问题或点击右侧热门问题，开始回测</div></div>
    <div id="loadingState" class="loading-wrap" style="display:none"><div class="spinner"></div><div class="loading-text">正在回测，请稍候...</div></div>
    <div id="errorState" class="error-msg" style="display:none"></div>
    <div id="resultArea" style="display:none">
      <div class="section">
        <div class="toggle-row">
          <button class="t-btn active" id="btnMktCap" onclick="switchMethod('market_cap_weight')">市值调仓</button>
          <button class="t-btn" id="btnEqual" onclick="switchMethod('equal_weight')">等权调仓</button>
        </div>
        <div id="chart" class="chart-box"></div>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div class="section">
        <div class="section-title">组合 vs 大盘</div>
        <div id="radar" class="radar-box"></div>
      </div>
      <div class="section">
        <div class="holdings-hdr">
          <div class="section-title" style="margin-bottom:0">持仓明细</div>
          <select id="monthSelect" onchange="showHoldings()"></select>
        </div>
        <table id="holdingsTable">
          <thead><tr><th>股票代码</th><th>股票名称</th><th class="num">市值(亿)</th><th>行业</th><th class="num">PE</th></tr></thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-title">🔥 热门问题</div>
    <div id="hotList"></div>
  </div>
</div>
<script>
var lastParsed=null,chartInst=null,radarInst=null,curMethod='market_cap_weight',lastHoldings={};
function fmt(v){if(v==null)return'—';return v>=0?'<span class="up">+'+(v*100).toFixed(2)+'%</span>':'<span class="down">'+(v*100).toFixed(2)+'%</span>'}
function doBacktest(){var q=document.getElementById('question').value.trim();if(!q)return;show('loadingState');hide('emptyState');hide('resultArea');hide('errorState');document.getElementById('sendBtn').disabled=true;fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(function(r){return r.json()}).then(function(p){if(p.error){showError(p.message||'解析失败');return}lastParsed=p;runBacktest(p)}).catch(function(e){showError('解析失败: '+e)})}
function runBacktest(p){var period=Math.min(p.period_years||3,3);var now=new Date();var end=now.toISOString().slice(0,10);var start=new Date(now-period*365*86400000).toISOString().slice(0,10);fetch('/api/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filters:p.filters,start_date:start,end_date:end,rebalance:p.rebalance||'Q',portfolio_method:curMethod})}).then(function(r){return r.json()}).then(function(d){hide('loadingState');document.getElementById('sendBtn').disabled=false;if(d.error){showError(d.error);return}renderResult(d)}).catch(function(e){showError('回测失败: '+e);document.getElementById('sendBtn').disabled=false})}
function switchMethod(m){curMethod=m;document.getElementById('btnMktCap').className='t-btn'+(m==='market_cap_weight'?' active':'');document.getElementById('btnEqual').className='t-btn'+(m==='equal_weight'?' active':'');if(lastParsed){hide('resultArea');show('loadingState');runBacktest(lastParsed)}}
function renderResult(d){var el=document.getElementById('resultArea');el.style.display='block';el.className='fade-in';var pC=d.portfolio_curve||[];var bC=d.benchmark_curve||[];var dates=pC.map(function(p){return p[0]});if(!chartInst)chartInst=echarts.init(document.getElementById('chart'));chartInst.setOption({backgroundColor:'#fff',animation:true,animationDuration:800,animationEasing:'cubicOut',tooltip:{trigger:'axis',backgroundColor:'#fff',borderColor:'#e5e5ea',borderWidth:1,borderRadius:12,textStyle:{color:'#1d1d1f',fontSize:13}},legend:{data:['组合','大盘'],top:10,textStyle:{color:'#86868b',fontSize:13}},grid:{left:80,right:30,top:60,bottom:80},xAxis:{type:'category',data:dates,axisLabel:{color:'#86868b',fontSize:11},axisLine:{lineStyle:{color:'#e5e5ea'}}},yAxis:{type:'value',scale:true,axisLabel:{color:'#86868b',fontSize:11,formatter:'¥{value}'},splitLine:{lineStyle:{color:'#f5f5f7'}}},dataZoom:[{type:'inside',start:0,end:100},{type:'slider',start:0,end:100,height:24,bottom:10,borderColor:'#e5e5ea',fillerColor:'rgba(0,113,227,0.1)'}],series:[{name:'组合',type:'line',data:pC.map(function(p){return p[1]}),smooth:true,symbol:'none',lineStyle:{width:2,color:'#0071e3'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(0,113,227,0.15)'},{offset:1,color:'rgba(0,113,227,0)'}]}},itemStyle:{color:'#0071e3'}},{name:'大盘',type:'line',data:bC.map(function(b){return b[1]}),smooth:true,symbol:'none',lineStyle:{width:1,color:'#86868b',type:'dashed'},itemStyle:{color:'#86868b'}}]});var st=d.stats||{};document.getElementById('statsRow').innerHTML='<div class="stat-card"><div class="stat-value simhei">'+fmt(st.total_return)+'</div><div class="stat-label">总收益</div></div><div class="stat-card"><div class="stat-value simhei">'+fmt(st.annual_return)+'</div><div class="stat-label">年化收益</div></div><div class="stat-card"><div class="stat-value simhei">'+fmt(st.max_drawdown)+'</div><div class="stat-label">最大回撤</div></div><div class="stat-card"><div class="stat-value simhei">'+(st.sharpe_ratio!=null?st.sharpe_ratio.toFixed(2):'—')+'</div><div class="stat-label">夏普比率</div></div><div class="stat-card"><div class="stat-value simhei">'+fmt(st.win_rate)+'</div><div class="stat-label">胜率</div></div>';var rd=d.radar||{};if(!radarInst)radarInst=echarts.init(document.getElementById('radar'));radarInst.setOption({backgroundColor:'#fff',animation:true,animationDuration:500,radar:{indicator:(rd.indicators||[]).map(function(n){return{name:n,max:100}}),shape:'polygon',splitArea:{areaStyle:{color:['#fff','#f5f5f7']}},axisLine:{lineStyle:{color:'#e5e5ea'}},splitLine:{lineStyle:{color:'#e5e5ea'}}},series:[{type:'radar',data:[{value:rd.portfolio||[],name:'组合',areaStyle:{color:'rgba(0,113,227,0.2)'},lineStyle:{color:'#0071e3',width:2},itemStyle:{color:'#0071e3'}},{value:rd.benchmark||[],name:'大盘',areaStyle:{color:'rgba(134,134,139,0.15)'},lineStyle:{color:'#86868b',width:1},itemStyle:{color:'#86868b'}}]}],legend:{bottom:0,textStyle:{color:'#86868b',fontSize:13}}});lastHoldings=d.holdings_by_date||{};var sel=document.getElementById('monthSelect');var dates2=Object.keys(lastHoldings).sort().reverse();sel.innerHTML=dates2.map(function(d){return'<option value="'+d+'">'+d.slice(0,4)+'年'+parseInt(d.slice(4,6))+'月</option>'}).join('');showHoldings()}
function showHoldings(){var sel=document.getElementById('monthSelect').value;var h=lastHoldings[sel]||{};var codes=Object.keys(h);var tbody=document.getElementById('holdingsBody');if(!codes.length){tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:#86868b">无持仓数据</td></tr>';return}tbody.innerHTML=codes.map(function(c){return'<tr><td>'+c+'</td><td>—</td><td class="num">—</td><td>—</td><td class="num">—</td></tr>'}).join('')}
function showError(msg){hide('loadingState');var el=document.getElementById('errorState');el.textContent=msg;el.style.display='block';document.getElementById('sendBtn').disabled=false}
function show(id){document.getElementById(id).style.display='block'}
function hide(id){document.getElementById(id).style.display='none'}
function loadHot(){fetch('/api/hot-questions').then(function(r){return r.json()}).then(function(qs){var el=document.getElementById('hotList');el.innerHTML=qs.map(function(q,i){return'<div class="hot-item" onclick="clickHot('+q.id+',this)"><span class="hot-rank'+(i<3?' top':'')+'">'+(i+1)+'</span><span class="hot-text">'+q.question+'</span></div>'}).join('')}).catch(function(){})}
function clickHot(id,el){var q=el.querySelector('.hot-text').textContent;document.getElementById('question').value=q;doBacktest();fetch('/api/hot-questions/'+id+'/click',{method:'POST'}).catch(function(){})}
loadHot();setInterval(loadHot,30000);document.getElementById('question').addEventListener('keydown',function(e){if(e.key==='Enter')doBacktest()});
</script>
</body>
</html>
